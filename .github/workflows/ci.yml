name: CI

on:
  push:
    branches: [ main, feat/sarif-format ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jsonschema pytest click rich
        pip install -e .

    - name: Run tests
      run: |
        pytest tests/

    - name: Test SARIF output CLI and validate JSON
      run: |
        python -m depscan.cli scan . --format sarif > test.sarif
        python -m json.tool test.sarif > /dev/null
